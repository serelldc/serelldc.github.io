<body>
<div id="zk-intro" aria-hidden="true"><video muted playsinline preload="auto"></video><span>Tap to skip</span></div>
<script>
  // Launch intro: plays when the app is opened from the home-screen icon (once per launch).
  // Add ?intro=1 to the link to preview it in a normal browser.
  (function () {
    var force = /[?&]intro=1/.test(location.search);
    var mq = function (q) { return window.matchMedia && matchMedia(q).matches; };
    var standalone = mq('(display-mode: standalone)') || navigator.standalone === true;
    var seen = null; try { seen = sessionStorage.getItem('zk.intro'); } catch (e) {}
    if (!force && (!standalone || seen || mq('(prefers-reduced-motion: reduce)'))) return;
    try { sessionStorage.setItem('zk.intro', '1'); } catch (e) {}
    var el = document.getElementById('zk-intro'), v = el.querySelector('video'), done = false, started = false;
    function end() { if (done) return; done = true; el.className = 'out'; setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500); }
    el.style.display = 'flex';
    v.addEventListener('playing', function () { started = true; });
    v.addEventListener('ended', function () { setTimeout(end, 150); });
    v.addEventListener('error', end);
    el.addEventListener('click', end);
    setTimeout(function () { if (!started) end(); }, 1800); // slow connection: never keep people waiting
    setTimeout(end, 7000);
    v.src = 'img/intro.mp4?v=2';
    var p = v.play(); if (p && p.catch) p.catch(end);
  })();
</script>
<div class="shell" id="app">

</div>
<script>
  // Phone in Chrome "Desktop site" mode shows the page ~980px wide, so the app looks tiny.
  // Scale the app back up to the real phone width so it always fills the screen.
  (function () {
    function fit() {
      var el = document.getElementById('app'); if (!el) return;
      var sw = window.screen && screen.width || 0, touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      var small = Math.min(screen.width || 9999, screen.height || 9999) < 700;
      if (touch && small && sw && window.innerWidth > sw * 1.3) {
        var z = window.innerWidth / sw;
        el.style.zoom = z; el.style.maxWidth = 'none'; el.style.width = (window.innerWidth / z) + 'px'; el.style.height = (window.innerHeight / z) + 'px';
        document.documentElement.classList.add('zk-fit'); // it's still a phone: keep the phone layout, not tablet/desktop
      } else if (el.style.zoom) {
        el.style.zoom = ''; el.style.maxWidth = ''; el.style.width = ''; el.style.height = '';
        document.documentElement.classList.remove('zk-fit');
      }
    }
    fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  })();
</script>
