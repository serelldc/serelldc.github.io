<script>
  // Phone in Chrome "Desktop site" mode shows the page ~980px wide, so the app looks tiny.
  // Scale the app back up to the real phone width so it always fills the screen.
  (function () {
    function fit() {
      var el = document.getElementById('app'); if (!el) return;
      var sw = window.screen && screen.width || 0, touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      var small = Math.min(screen.width || 9999, screen.height || 9999) < 700;
      if (touch && small && sw && window.innerWidth > sw * 1.3) {
        var z = window.innerWidth / sw;
        el.style.zoom = z; el.style.maxWidth = 'none'; el.style.width = (window.innerWidth / z) + 'px'; el.style.height = (window.innerHeight / z) + 'px';
      } else if (el.style.zoom) {
        el.style.zoom = ''; el.style.maxWidth = ''; el.style.width = ''; el.style.height = '';
      }
    }
    fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  })();
</script>
